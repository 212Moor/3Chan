<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <title>Inscription - 3Chan</title>
  <link rel="stylesheet" href="assets/style.css">
</head>
<body>
  <div class="container">
    <h2>Inscription</h2>
    <form id="registerForm">
      <div class="form-group">
        <input type="text" id="username" placeholder="Nom d'utilisateur" required minlength="3">
        <div id="usernameError" class="error"></div>
      </div>
      <div class="form-group">
        <input type="password" id="password" placeholder="Mot de passe" required minlength="6">
        <div id="passwordError" class="error"></div>
      </div>
      <button type="submit">S'inscrire</button>
      <div id="formError" class="error"></div>
    </form>
    <p>Déjà inscrit ? <a href="login.html">Se connecter</a></p>
  </div>

  <script>
    document.getElementById('registerForm').addEventListener('submit', async (e) => {
      e.preventDefault();
      document.querySelectorAll('.error').forEach(el => el.textContent = '');
      const username = document.getElementById('username').value.trim();
      const password = document.getElementById('password').value;

      try {
        const response = await fetch('/cgi-bin/api.py', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({
            action: 'register',
            username,
            password
          })
        });

        const data = await response.json();
        if (data.success) {
          localStorage.setItem('currentUser', JSON.stringify({
            id: data.user_id, // Vérifiez que data.user_id est défini
            username: username,
            avatar: 'default.png'
          }));
          window.location.href = 'forum.html';
        } else {
          document.getElementById('formError').textContent = data.error || "Erreur d'inscription";
        }
      } catch (error) {
        document.getElementById('formError').textContent = "Erreur de connexion au serveur";
        console.error(error);
      }
    });
  </script>
</body>
</html>
