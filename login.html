<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <title>Connexion - 3Chan</title>
  <link rel="stylesheet" href="assets/style.css">
</head>
<body>
  <div class="container">
    <h2>Connexion</h2>
    <form id="loginForm">
      <div class="form-group">
        <input type="text" id="username" placeholder="Nom d'utilisateur" required>
      </div>
      <div class="form-group">
        <input type="password" id="password" placeholder="Mot de passe" required>
      </div>
      <button type="submit">Se connecter</button>
      <div id="formError" class="error"></div>
    </form>
    <p>Pas encore de compte ? <a href="register.html">Créer un compte</a></p>
  </div>

  <script>
    document.getElementById('loginForm').addEventListener('submit', async (e) => {
      e.preventDefault();
      const username = document.getElementById('username').value.trim();
      const password = document.getElementById('password').value;

      try {
        const response = await fetch('/cgi-bin/api.py', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ action: 'login', username, password })
        });

        const data = await response.json();
        console.log("Réponse serveur (login):", data);

        if (data.success) {
          localStorage.setItem('currentUser', JSON.stringify({
            id: data.user_id,
            username: data.username,
            avatar: data.avatar || 'default.png'
          }));
          window.location.href = 'forum.html';
        } else {
          document.getElementById('formError').textContent = data.error || "Échec de connexion";
        }
      } catch (error) {
        console.error("Erreur lors de la requête login:", error);
        document.getElementById('formError').textContent = "Erreur de connexion au serveur";
      }
    });
  </script>
</body>
</html>
